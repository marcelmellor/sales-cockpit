[build]
  command = "next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL"
  # Private git deps (e.g. `@sipgate/revop-ui`) are cloned via the
  # `scripts/netlify-git-auth.sh` preinstall hook, which expects GITHUB_PAT
  # (or GITHUB_TOKEN) to be set in the Netlify dashboard env-vars.

[[plugins]]
  package = "@netlify/plugin-nextjs"
