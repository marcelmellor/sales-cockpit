[build]
  command = "next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL"
  # Git auth for private deps (e.g. @sipgate/revop-ui). Needs to take effect
  # BEFORE Netlify's automatic `npm install` runs — npm's hosted-git-info
  # normalizes github.com URLs to SSH even when the lockfile says git+https,
  # so we need a credential mechanism that's set up at shell-env level.
  # GIT_CONFIG_COUNT/KEY/VALUE is a git built-in: those entries are loaded
  # by git as if they were in ~/.gitconfig, but happen before any command runs.
  #   - KEY_0/VALUE_0: rewrite ssh://git@github.com/  -> https://github.com/
  #   - KEY_1/VALUE_1: rewrite scp-style git@github.com: -> https://github.com/
  #   - KEY_2/VALUE_2: inline credential helper that echoes GITHUB_PAT for
  #     github.com HTTPS clones. The `!f() {...}; f` form is git's shell-helper
  #     syntax; `$GITHUB_PAT` is expanded at runtime by the shell, so the token
  #     value isn't baked into this file.
  GIT_CONFIG_COUNT = "3"
  GIT_CONFIG_KEY_0 = "url.https://github.com/.insteadOf"
  GIT_CONFIG_VALUE_0 = "ssh://git@github.com/"
  GIT_CONFIG_KEY_1 = "url.https://github.com/.insteadOf"
  GIT_CONFIG_VALUE_1 = "git@github.com:"
  GIT_CONFIG_KEY_2 = "credential.https://github.com.helper"
  GIT_CONFIG_VALUE_2 = "!f() { echo username=x-access-token; echo password=$GITHUB_PAT; }; f"

[[plugins]]
  package = "@netlify/plugin-nextjs"
